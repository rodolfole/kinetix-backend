services:
  postgres:
    image: postgres:16-alpine
    container_name: kinetix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - kinetix-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot init: create kinetix-db database
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kinetix-dbinit
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: kinetix-db
    entrypoint: ["/app/kinetix-dbinit"]
    restart: "no"

  # One-shot: apply migrations via goose (built into the API image)
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kinetix-migrations
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://postgres:postgres@postgres:5432/kinetix-db?sslmode=disable
    working_dir: /app/migrations
    entrypoint: ["/bin/sh", "-c", "goose -dir /app/migrations up && echo MIGRATIONS_OK"]
    restart: "no"

  # One-shot: run the seed binary
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kinetix-seed
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: kinetix-db
      DB_SSLMODE: disable
      JWT_SECRET: dev-secret-change-in-production
    entrypoint: ["/app/kinetix-seed"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kinetix-api
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: kinetix-db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      JWT_SECRET: dev-secret-change-in-production
      JWT_TOKEN_EXPIRY: 24h
      CORS_ALLOWED_ORIGINS: "http://localhost:4325,http://127.0.0.1:4325"
      MP_ACCESS_TOKEN: ""
      MP_PUBLIC_KEY: ""
      MP_SANDBOX: "true"
      WEBHOOK_BASE_URL: ""
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  kinetix-pgdata:
    driver: local
