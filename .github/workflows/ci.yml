name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Build, vet and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Unit tests (race)
        run: go test -race ./... -count=1

      - name: Build
        run: go build ./...

  integration:
    name: Integration (PostgreSQL + live API)
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kinetix-db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: kinetix-db
      DB_SSLMODE: disable
      JWT_SECRET: ci-only-secret-not-for-production
      SERVER_PORT: '8085'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.22.1

      - name: Run migrations
        run: goose -dir internal/adapters/postgresql/migrations postgres "postgres://postgres:postgres@localhost:5432/kinetix-db?sslmode=disable" up

      - name: Seed demo data
        run: go run ./cmd/seed

      - name: Start API
        run: |
          go build -o /tmp/kinetix-api ./cmd/api
          /tmp/kinetix-api &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8085/health > /dev/null; then echo ready; break; fi
            sleep 1
          done

      - name: Integration tests
        run: go test -tags=integration ./internal/integration_test/ -count=1 -v
