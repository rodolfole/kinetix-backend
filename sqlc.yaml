version: "2"
sql:
  - engine: "postgresql"
    queries:
      - "./internal/adapters/postgresql/sqlc/queries.sql"
    schema: "./internal/adapters/postgresql/migrations"
    gen:
      go:
        package: "db"
        out: "./internal/adapters/postgresql/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "date"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "decimal"
            go_type:
              import: "database/sql"
              type: "Float64"
          # jsonb defaults to []byte with pgx/v5, no override needed